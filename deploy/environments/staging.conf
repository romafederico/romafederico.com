# Staging target for deploy/deploy.sh and deploy/smoke-test.sh (#7). Not secret: committed on purpose,
# there are no GitHub secrets or variables. Values from #2 (dev server) and #3 (AWS).
# One KEY=VALUE per line; the scripts read only the keys they know.

# Dev server, reached only through the deploy-gate-rf allow-list (#2). The gate fixes every path
# under DEPLOY_DIR itself; it is here for reference.
DEPLOY_HOST=66.179.251.96
DEPLOY_USER=deploy
DEPLOY_DIR=/opt/rf-staging
SITE_URL=https://staging.romafederico.com

# Role romafederico-gha-staging trusts only runs on main (OIDC).
AWS_REGION=us-east-1
AWS_ROLE_ARN=arn:aws:iam::441641151006:role/romafederico-gha-staging
# Trailing slash needed: the role may read /romafederico/staging/* only.
SSM_PATH=/romafederico/staging/
