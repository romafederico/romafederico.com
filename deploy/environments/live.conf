# Live target for deploy/deploy.sh --env live and deploy/smoke-test.sh --env live (#11). Not secret:
# committed on purpose, there are no GitHub secrets or variables. Values from #9 (DreamHost) and
# #3 (AWS). One KEY=VALUE per line; the scripts read only the keys they know.

# DreamHost shared server. The live deploy key is forced to ~/bin/rf-live-gate (#8, #9), which
# fixes every path itself (~/romafederico.com, ~/rf-backups). This user also hosts diegokravetz.com
# and marielgaribaldi.com; the gate never touches them.
DEPLOY_HOST=pdx1-shared-a1-22.dreamhost.com
DEPLOY_USER=romafederico
SITE_URL=https://romafederico.com

# Role romafederico-gha-live trusts only runs on refs/tags/v* (OIDC, #3).
AWS_REGION=us-east-1
AWS_ROLE_ARN=arn:aws:iam::441641151006:role/romafederico-gha-live
# Trailing slash needed. The deploy reads only <SSM_PATH>DEPLOY_SSH_KEY (#6 Phase 2).
SSM_PATH=/romafederico/live/
